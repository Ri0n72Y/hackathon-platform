name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Installation tests
        run: npm run test:installation

      - name: Router tests
        run: |
          if [ -f tests/router-fallback.test.mjs ]; then
            node --test tests/router-fallback.test.mjs
          else
            echo "Router tests not present on this ref; skipped."
          fi
